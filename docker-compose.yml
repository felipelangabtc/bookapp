version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: bookapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: litapp
    ports:
      - "5432:5432"
    volumes:
      - bookapp_pgdata:/var/lib/postgresql/data

volumes:
  bookapp_pgdata:
